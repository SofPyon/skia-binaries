name: Lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned rather than using the runner's preinstalled shellcheck: the two differ, and the
      # same finding is reported under a different code by each (SC2317 vs SC2329), so an
      # unpinned linter turns a green local run into a red CI run for no change of ours.
      # README's Maintenance section names the identical command to run locally.
      - name: shellcheck
        run: docker run --rm -v "${PWD}:/mnt" koalaman/shellcheck:v0.11.0 scripts/*.sh

      # download-actionlint.bash is fetched from a tagged (immutable) ref and given an explicit
      # version, rather than "latest", so this step's behavior can't change under us.
      - name: Install actionlint
        run: |
          bash <(curl -fsSL "https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash") 1.7.12 "${RUNNER_TEMP}/bin"
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"

      - name: actionlint
        run: actionlint -color

      - name: Validate skia.lock
        run: scripts/check-lock.sh
